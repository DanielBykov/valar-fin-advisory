<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Manrope, 'Segoe UI', Arial, sans-serif">
  <rect width="1600" height="900" fill="#f6f7f9"/>

  <!-- Ground line -->
  <line x1="80" y1="760" x2="900" y2="760" stroke="#c9ced6" stroke-width="4"/>

  <!-- Roof -->
  <polygon points="140,330 480,110 820,330" fill="#061634"/>

  <!-- Upstairs: the owners -->
  <rect x="180" y="330" width="600" height="210" fill="#ffffff" stroke="#061634" stroke-width="6"/>
  <rect x="205" y="385" width="60" height="70" fill="#c8cbe3"/>
  <rect x="695" y="385" width="60" height="70" fill="#c8cbe3"/>
  <text x="480" y="420" text-anchor="middle" font-size="22" font-weight="700" fill="#8f93b5" letter-spacing="3">UPSTAIRS</text>
  <text x="480" y="470" text-anchor="middle" font-size="40" font-weight="700" fill="#061634">You live here</text>

  <!-- Ground floor: the tenant -->
  <rect x="180" y="540" width="600" height="220" fill="#2e4882" stroke="#061634" stroke-width="6"/>
  <rect x="205" y="595" width="60" height="70" fill="#6f88c4"/>
  <rect x="700" y="640" width="55" height="120" fill="#6f88c4"/>
  <text x="480" y="630" text-anchor="middle" font-size="22" font-weight="700" fill="#c8cbe3" letter-spacing="3">GROUND FLOOR</text>
  <text x="480" y="680" text-anchor="middle" font-size="40" font-weight="700" fill="#ffffff">A tenant lives here</text>

  <!-- Arrow: your income -> mortgage -->
  <path d="M 790 435 C 960 435, 1020 470, 1110 470" fill="none" stroke="#8f93b5" stroke-width="10"/>
  <polygon points="1110,450 1145,470 1110,490" fill="#8f93b5"/>
  <text x="955" y="410" text-anchor="middle" font-size="34" font-weight="700" fill="#2e4882">your income</text>

  <!-- Arrow: rent -> mortgage -->
  <path d="M 790 650 C 960 650, 1020 590, 1110 590" fill="none" stroke="#e8a23a" stroke-width="14"/>
  <polygon points="1105,563 1150,590 1105,617" fill="#e8a23a"/>
  <text x="955" y="705" text-anchor="middle" font-size="34" font-weight="700" fill="#061634">rent from the tenant</text>

  <!-- Mortgage -->
  <rect x="1150" y="400" width="360" height="260" rx="20" fill="#061634"/>
  <text x="1330" y="500" text-anchor="middle" font-size="24" font-weight="700" fill="#e8a23a" letter-spacing="3">ONE MORTGAGE</text>
  <text x="1330" y="555" text-anchor="middle" font-size="34" font-weight="700" fill="#ffffff">paid from</text>
  <text x="1330" y="598" text-anchor="middle" font-size="34" font-weight="700" fill="#ffffff">two sources</text>

  <!-- Title -->
  <text x="80" y="840" font-size="36" font-weight="700" fill="#061634">Home and income: a bigger loan, carried partly by the house itself</text>
</svg>
